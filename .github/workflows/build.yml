name: Validate Publish Layouts

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

# Validate packaging without distributing the private Foundation dependency.
# Restore release/tag triggers and artifact publication only after Foundation's
# intended NuGet distribution is available and a release is explicitly prepared.
permissions:
  contents: read

# Checkout and SDK setup use Node 24 action runtimes.
# Publish keeps Full analysis, with one MSBuild project at a time and isolated compilers.
env:
  PROJECT_PATH: src/BethesdaMultitool/BethesdaMultitool.csproj

jobs:
  build-windows-gui:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    name: Windows GUI (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Checkout pinned dependencies
        uses: ./.github/actions/checkout-dependencies
        with:
          shared-ssh-key: ${{ secrets.MULTITOOL_SHARED_SSH_KEY }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Build and Publish Windows GUI
        run: dotnet publish ${{ env.PROJECT_PATH }} -c Release -f net10.0-windows10.0.19041.0 -r win-x64 --self-contained -p:AnalyzerProfile=Full -p:Platform=x64 -m:1 -nodeReuse:false -p:UseSharedCompilation=false -o publish/win-gui

      - name: Include license files
        run: |
          Copy-Item LICENSE publish/win-gui/
          Copy-Item THIRD_PARTY_LICENSES publish/win-gui/

  build-windows-cli:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    name: Windows CLI (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Checkout pinned dependencies
        uses: ./.github/actions/checkout-dependencies
        with:
          shared-ssh-key: ${{ secrets.MULTITOOL_SHARED_SSH_KEY }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Build and Publish Windows CLI
        run: dotnet publish ${{ env.PROJECT_PATH }} -c Release -f net10.0 -r win-x64 --self-contained -p:BuildTestsOnly=true -p:AnalyzerProfile=Full -p:Platform=x64 -m:1 -nodeReuse:false -p:UseSharedCompilation=false -o publish/win-cli

      - name: Include license files
        run: |
          Copy-Item LICENSE publish/win-cli/
          Copy-Item THIRD_PARTY_LICENSES publish/win-cli/

  build-linux-cli:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    name: Linux CLI (x64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Checkout pinned dependencies
        uses: ./.github/actions/checkout-dependencies
        with:
          shared-ssh-key: ${{ secrets.MULTITOOL_SHARED_SSH_KEY }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Build and Publish Linux CLI
        run: dotnet publish ${{ env.PROJECT_PATH }} -c Release -f net10.0 -r linux-x64 --self-contained -p:BuildTestsOnly=true -p:AnalyzerProfile=Full -m:1 -nodeReuse:false -p:UseSharedCompilation=false -o publish/linux-cli

      - name: Include license files
        run: |
          cp LICENSE publish/linux-cli/
          cp THIRD_PARTY_LICENSES publish/linux-cli/

  build-audio-transcriber:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    name: Audio Transcriber (Windows x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Checkout pinned dependencies
        uses: ./.github/actions/checkout-dependencies
        with:
          shared-ssh-key: ${{ secrets.MULTITOOL_SHARED_SSH_KEY }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Build and Publish Audio Transcriber
        run: dotnet publish src/BethesdaAudioTranscriber/BethesdaAudioTranscriber.csproj -c Release -r win-x64 --self-contained -p:AnalyzerProfile=Full -p:Platform=x64 -m:1 -nodeReuse:false -p:UseSharedCompilation=false -o publish/audio-transcriber

      - name: Include license files
        run: |
          Copy-Item LICENSE publish/audio-transcriber/
          Copy-Item THIRD_PARTY_LICENSES publish/audio-transcriber/
