name: Build and Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: windows-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        dotnet-quality: 'preview'
    
    - name: Restore dependencies
      run: dotnet restore
    
    - name: Build (Release)
      run: dotnet build --configuration Release --no-restore
    
    # The test project runs on the Microsoft.Testing.Platform runner (xunit.v3);
    # report/filter options are MTP-style and must come after the `--` separator.
    # Coverage is kept out of this blocking job. The separate non-blocking job below uses coverlet's
    # static IL instrumentation; Microsoft's dynamic-instrumentation engines deadlock on this assembly
    # (see CLAUDE.md, "Code coverage").
    - name: Run Tests
      # RUN_SHADER_COMPILE_TESTS=1 is set here and nowhere else in CI. Without it every test behind
      # ShaderCompileTestGuard is SKIPPED, and the only HLSL CI ever fed to FXC was
      # terrain_textured.frag.hlsl via one ungated test — so a shader that failed to compile reached
      # whoever next loaded that game, appearing as a silently missing 3D view rather than a build
      # failure (the GUI degrades a compile throw to a log line). Costs roughly a minute.
      # RUN_BUCKET_B / RUN_GPU_TESTS stay off: they need retail game assets and a GPU respectively.
      env:
        RUN_SHADER_COMPILE_TESTS: '1'
      run: |
        dotnet test --project tests/BethesdaMultitool.Tests/BethesdaMultitool.Tests.csproj `
          --configuration Release `
          --no-build `
          -- `
          --report-xunit-trx `
          --report-xunit-trx-filename test-results.trx `
          --results-directory ./TestResults `
          --minimum-expected-tests 6000

    # These test projects are intentionally not members of BethesdaMultitool.slnx, so neither the
    # solution build nor the main test command above discovers them. Run them explicitly instead of
    # letting healthy local suites silently have zero CI coverage.
    - name: Run Auxiliary Tool Tests
      run: |
        dotnet test --project tools/EsmSchemaGen.Tests/EsmSchemaGen.Tests.csproj `
          --configuration Release `
          -- `
          --report-xunit-trx `
          --report-xunit-trx-filename esm-schema-gen-test-results.trx `
          --results-directory ./TestResults `
          --minimum-expected-tests 15
        dotnet test --project src/DDXConv/DDXConv.Tests/DDXConv.Tests.csproj `
          --configuration Release `
          -- `
          --report-xunit-trx `
          --report-xunit-trx-filename ddxconv-test-results.trx `
          --results-directory ./TestResults `
          --minimum-expected-tests 65

    - name: Upload Test Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: ./TestResults
        retention-days: 30

  # Non-blocking coverage measurement (coverlet static IL — the only engine that works on
  # this codebase; the Microsoft dynamic-instrumentation engine deadlocks, see CLAUDE.md).
  coverage:
    runs-on: windows-latest
    needs: build-and-test
    continue-on-error: true
    timeout-minutes: 25

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        dotnet-quality: 'preview'

    - name: Install coverlet
      run: dotnet tool install --global coverlet.console

    - name: Run coverage
      run: pwsh tools/scripts/coverage.ps1

    - name: Upload Coverage Report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: TestResults/coverage
        retention-days: 30

  build-cli-cross-platform:
    runs-on: ubuntu-latest
    needs: build-and-test
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        dotnet-quality: 'preview'
    
    - name: Build CLI (Linux)
      run: |
        dotnet build src/BethesdaMultitool/BethesdaMultitool.csproj \
          --configuration Release \
          --framework net10.0
    
    - name: Verify CLI builds on Linux
      run: |
        echo "CLI build successful on Linux"
