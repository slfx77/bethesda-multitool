name: Build and Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: windows-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        submodules: recursive
    
    # Deliberately no `dotnet-quality: preview`. It was correct while .NET 10 was pre-GA, but it
    # now resolves 10.0.x to a release candidate (10.0.100-rc.2) rather than the GA SDK developers
    # build with (10.0.4xx). That drift is not cosmetic — `dotnet test` argument parsing differs
    # between the two, so a command can pass on the RC and fail on every developer machine, or the
    # reverse. CI must run the SDK the project actually ships on.
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore
    
    - name: Build (Release)
      run: dotnet build --configuration Release --no-restore
    
    # The test project runs on the Microsoft.Testing.Platform runner (xunit.v3);
    # report/filter options are MTP-style and must come after the `--` separator.
    # CI does not measure coverage at all — see the note above build-cli-cross-platform.
    - name: Run Tests
      # RUN_SHADER_COMPILE_TESTS=1 is set here and nowhere else in CI. Without it every test behind
      # ShaderCompileTestGuard is SKIPPED, and the only HLSL CI ever fed to FXC was
      # terrain_textured.frag.hlsl via one ungated test — so a shader that failed to compile reached
      # whoever next loaded that game, appearing as a silently missing 3D view rather than a build
      # failure (the GUI degrades a compile throw to a log line). Costs roughly a minute.
      # RUN_BUCKET_B / RUN_GPU_TESTS stay off: they need retail game assets and a GPU respectively.
      env:
        RUN_SHADER_COMPILE_TESTS: '1'
      run: |
        dotnet test --project tests/BethesdaMultitool.Tests/BethesdaMultitool.Tests.csproj `
          --configuration Release `
          --no-build `
          --results-directory ./TestResults `
          -- `
          --report-xunit-trx `
          --report-xunit-trx-filename test-results.trx `
          --minimum-expected-tests 6000

    # These test projects are intentionally not members of BethesdaMultitool.slnx, so neither the
    # solution build nor the main test command above discovers them. Run them explicitly instead of
    # letting healthy local suites silently have zero CI coverage.
    # `--results-directory` must precede the `--` separator. Passed after it, the GA SDK's
    # `dotnet test` rejects the whole command with "Specifying a directory for 'dotnet test'
    # should be via '--project' or '--solution'". These projects also need an explicit build:
    # they are outside the solution, so the Build step above never produces their output and
    # `--no-build` would otherwise fail.
    #
    # --minimum-expected-tests is a FLOOR that guards against tests silently not being
    # discovered, so it must be set below what CI actually executes — not at the local total.
    # DDXConv's was 216 of 217, which only ever held on a machine with Sample/ present; on CI
    # its 38 real-asset cases skip correctly, 179 run, and the policy failed the step with
    # exit code 9. 150 keeps the not-discovered alarm while leaving room for more gated cases.
    # Every command is exit-code checked. A pwsh `run:` block reports only its LAST command's
    # status, so without these guards a failing build here is swallowed: the test module never
    # gets built, `dotnet test` reports "Zero tests ran", the next project succeeds, and the step
    # goes green having run nothing. --minimum-expected-tests does NOT save you — the floor is
    # evaluated by a test host that never started.
    - name: Run Auxiliary Tool Tests
      run: |
        function Invoke-Checked {
          param([string] $What, [scriptblock] $Command)
          & $Command
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::$What failed with exit code $LASTEXITCODE"
            exit $LASTEXITCODE
          }
        }

        Invoke-Checked "EsmSchemaGen.Tests build" {
          dotnet build tools/EsmSchemaGen.Tests/EsmSchemaGen.Tests.csproj --configuration Release
        }
        Invoke-Checked "EsmSchemaGen.Tests" {
          dotnet test --project tools/EsmSchemaGen.Tests/EsmSchemaGen.Tests.csproj `
            --configuration Release `
            --no-build `
            --results-directory ./TestResults `
            -- `
            --report-xunit-trx `
            --report-xunit-trx-filename esm-schema-gen-test-results.trx `
            --minimum-expected-tests 15
        }
        Invoke-Checked "DDXConv.Tests build" {
          dotnet build src/DDXConv/DDXConv.Tests/DDXConv.Tests.csproj --configuration Release
        }
        Invoke-Checked "DDXConv.Tests" {
          dotnet test --project src/DDXConv/DDXConv.Tests/DDXConv.Tests.csproj `
            --configuration Release `
            --no-build `
            --results-directory ./TestResults `
            -- `
            --report-xunit-trx `
            --report-xunit-trx-filename ddxconv-test-results.trx `
            --minimum-expected-tests 150
        }

    - name: Upload Test Results
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: test-results
        path: ./TestResults
        retention-days: 30

  # No coverage job here by design. Coverage is opt-in and local, via tools/scripts/coverage.ps1,
  # which .gitignore deliberately keeps out of the repo along with the rest of the dev tooling —
  # so a CI job invoking it could never work. See CLAUDE.md, "Code Coverage".
  build-cli-cross-platform:
    runs-on: ubuntu-latest
    needs: build-and-test
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        submodules: recursive
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'
    
    # -p:BuildTestsOnly=true, not just --framework. The project cross-targets
    # net10.0;net10.0-windows10.0.19041.0, and --framework does not stop MSBuild evaluating the
    # Windows TFM, which fails on Linux with NETSDK1100 ("To build a project targeting Windows on
    # this operating system, set the EnableWindowsTargeting property"). BuildTestsOnly collapses
    # TargetFrameworks to net10.0 outright, which is exactly the CLI surface this job verifies.
    - name: Build CLI (Linux)
      run: |
        dotnet build src/BethesdaMultitool/BethesdaMultitool.csproj \
          --configuration Release \
          -p:BuildTestsOnly=true \
          --framework net10.0
    
    - name: Verify CLI builds on Linux
      run: |
        echo "CLI build successful on Linux"
