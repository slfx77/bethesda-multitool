name: Build and Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: windows-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        dotnet-quality: 'preview'
    
    - name: Restore dependencies
      run: dotnet restore
    
    - name: Build (Release)
      run: dotnet build --configuration Release --no-restore
    
    # The test project runs on the Microsoft.Testing.Platform runner (xunit.v3);
    # report/filter options are MTP-style and must come after the `--` separator.
    # Code coverage is intentionally absent: both instrumentation engines fail on
    # this codebase today (see CLAUDE.md, "Code coverage").
    - name: Run Tests
      run: |
        dotnet test --project tests/BethesdaMultitool.Tests/BethesdaMultitool.Tests.csproj `
          --configuration Release `
          --no-build `
          -- `
          --report-xunit-trx `
          --report-xunit-trx-filename test-results.trx `
          --results-directory ./TestResults `
          --minimum-expected-tests 6000

    - name: Upload Test Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: ./TestResults
        retention-days: 30

  # Non-blocking coverage measurement (coverlet static IL — the only engine that works on
  # this codebase; the Microsoft dynamic-instrumentation engine deadlocks, see CLAUDE.md).
  coverage:
    runs-on: windows-latest
    needs: build-and-test
    continue-on-error: true
    timeout-minutes: 25

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        dotnet-quality: 'preview'

    - name: Install coverlet
      run: dotnet tool install --global coverlet.console

    - name: Run coverage
      run: pwsh tools/scripts/coverage.ps1

    - name: Upload Coverage Report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: TestResults/coverage
        retention-days: 30

  build-cli-cross-platform:
    runs-on: ubuntu-latest
    needs: build-and-test
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        dotnet-quality: 'preview'
    
    - name: Build CLI (Linux)
      run: |
        dotnet build src/BethesdaMultitool/BethesdaMultitool.csproj \
          --configuration Release \
          --framework net10.0
    
    - name: Verify CLI builds on Linux
      run: |
        echo "CLI build successful on Linux"
